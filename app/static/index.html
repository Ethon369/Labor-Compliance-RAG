<!DOCTYPE html>
<html lang="zh-CN" data-theme="cool" data-density="comfortable">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劳动与社会保障 RAG 问答平台</title>
<script>
/* 首帧前定主题，避免暗色模式下闪一下白屏 */
(function(){try{var t=localStorage.getItem('lcr_theme');
if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))
document.documentElement.dataset.theme='dark';}catch(e){}})();
</script>
<link rel="stylesheet" href="/tokens.css">
<style>
  body{
    font-family:var(--font-sans); background:var(--paper); color:var(--ink-1);
    height:100vh; display:flex; font-size:var(--fs-body); line-height:1.7;
    -webkit-font-smoothing:antialiased; text-wrap:pretty;
    transition:background var(--dur-3) var(--ease-out), color var(--dur-3) var(--ease-out);
  }

  /* ---- 侧边栏 ---- */
  .sidebar{
    width:var(--side-w); flex-shrink:0; background:var(--surface-2);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:6px; padding:20px 14px 14px;
    transition:background var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px;}
  .brand .mark{
    width:32px;height:32px;border-radius:var(--r-md);flex-shrink:0;
    background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  }
  .brand-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
  .brand-txt b{font-size:15px;font-weight:500;letter-spacing:-.01em;}
  .brand-txt em{font-style:normal;font-size:var(--fs-micro);color:var(--ink-3);letter-spacing:.06em;}

  .new-chat{
    display:flex;align-items:center;gap:8px;width:100%;
    background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);
    padding:9px 12px;text-align:left;cursor:pointer;font-size:var(--fs-sm);color:var(--ink-1);
    box-shadow:var(--e1);
    transition:border-color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out);
  }
  .new-chat:hover{border-color:var(--accent);box-shadow:var(--e2);}
  .new-chat svg{color:var(--accent);}

  .history-title{
    display:flex;align-items:center;justify-content:space-between;
    font-size:var(--fs-micro);color:var(--ink-3);letter-spacing:.08em;padding:22px 8px 8px;
  }
  .history-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;min-height:0;}
  .history-empty{padding:16px 8px;font-size:var(--fs-xs);color:var(--ink-4);text-align:center;line-height:1.8;}
  .history-item{
    padding:8px 10px;border-radius:var(--r-sm);font-size:var(--fs-sm);cursor:pointer;
    color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out);
  }
  .history-item:hover{background:var(--surface-3);color:var(--ink-1);}
  .history-item.active{
    background:var(--surface);color:var(--ink-1);box-shadow:var(--e1);
    border-left:2px solid var(--accent);padding-left:8px;
  }

  .auth-area{border-top:1px solid var(--line);padding:12px 4px 4px;display:flex;flex-direction:column;gap:4px;}
  .auth-user{display:flex;align-items:center;gap:8px;padding:2px 6px 8px;}
  .avatar{
    width:24px;height:24px;border-radius:var(--r-pill);flex-shrink:0;
    background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;
    font-size:var(--fs-micro);font-weight:500;font-family:var(--font-mono);
  }
  .auth-user .nm{flex:1;min-width:0;font-size:var(--fs-sm);color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .auth-user .logout-btn{
    color:var(--ink-3);cursor:pointer;font-size:var(--fs-xs);background:none;
    transition:color var(--dur-1) var(--ease-out);
  }
  .auth-user .logout-btn:hover{color:var(--accent);}
  .side-btn{
    display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);
    font-size:var(--fs-sm);color:var(--ink-2);text-align:left;
    transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out);
  }
  .side-btn:hover{background:var(--surface-3);color:var(--ink-1);}
  .side-btn svg{color:var(--ink-3);transition:color var(--dur-1) var(--ease-out);}
  .side-btn:hover svg{color:var(--accent);}
  .auth-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-md);
    padding:9px 12px;font-size:var(--fs-sm);cursor:pointer;color:var(--ink-1);box-shadow:var(--e1);
    transition:border-color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out);
  }
  .auth-btn:hover{border-color:var(--accent);box-shadow:var(--e2);}

  /* ---- 主区 ---- */
  .main{
    flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);
    transition:background var(--dur-3) var(--ease-out);
  }
  .header{
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:15px var(--gutter);display:flex;align-items:center;gap:14px;z-index:10;
    transition:background var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
  }
  .header h1{font-size:var(--fs-h1);font-weight:500;letter-spacing:-.015em;}
  .header .kb-pick{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--ink-3);}
  .header .kb-pick select{
    border:1px solid var(--line-2);border-radius:var(--r-sm);padding:5px 8px;
    font-size:var(--fs-xs);color:var(--ink-1);background:var(--surface);outline:none;max-width:200px;cursor:pointer;
    transition:border-color var(--dur-1) var(--ease-out);
  }
  .header .kb-pick select:hover{border-color:var(--accent);}
  .header .badge{
    font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--ink-3);
    border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px;white-space:nowrap;
  }

  .chat-area{
    flex:1;overflow-y:auto;padding:var(--gutter);
    display:flex;flex-direction:column;gap:var(--row);min-height:0;
  }

  /* ---- 消息 ---- */
  .msg{
    display:flex;flex-direction:column;width:auto;max-width:80%;
    animation:fadeIn .25s var(--ease-out);
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .msg.assistant,.msg.progress,.msg.error{align-self:flex-start;}
  .msg.user{align-self:flex-end;max-width:78%;align-items:flex-end;}
  .msg .label{
    display:flex;align-items:center;gap:6px;
    font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:9px;letter-spacing:.02em;
  }
  .msg.user .label{justify-content:flex-end;}
  .msg .label .lm{
    width:18px;height:18px;border-radius:var(--r-sm);flex-shrink:0;
    background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;
  }
  .msg .bubble{
    padding:0;border-radius:var(--r-lg);line-height:1.85;font-size:16px;
    word-break:break-word;white-space:pre-wrap;color:var(--ink-1);
  }
  .msg.user .bubble{
    background:var(--ink-1);color:var(--paper);padding:10px 15px;
    border-radius:var(--r-lg);border-bottom-right-radius:3px;
  }
  .msg.progress .bubble{
    background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--line-2);
    border-radius:var(--r-md);padding:10px 14px;font-size:var(--fs-sm);width:fit-content;
  }
  .msg.error .bubble{color:var(--danger);}

  /* ---- 引用溯源：左侧细线 + 等宽编号（替换原绿色卡片） ---- */
  .citations{margin-top:22px;border:none;border-top:1px solid var(--line);padding:14px 0 0;background:none;border-radius:0;}
  .citations summary{
    cursor:pointer;font-size:var(--fs-xs);color:var(--ink-3);letter-spacing:.1em;list-style:none;
    transition:color var(--dur-1) var(--ease-out);
  }
  .citations summary::-webkit-details-marker{display:none;}
  .citations summary:hover{color:var(--ink-2);}
  .cit-list{margin-top:12px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:2px;}
  .cit-card{
    padding:12px 12px 12px 14px;margin-bottom:0;background:transparent;border:none;
    border-left:2px solid var(--line-2);border-radius:0 var(--r-sm) var(--r-sm) 0;
    transition:border-color var(--dur-2) var(--ease-out),background var(--dur-2) var(--ease-out);
  }
  .cit-card:hover{border-left-color:var(--accent);background:var(--surface-2);}
  .cit-head{
    font-size:var(--fs-sm);color:var(--ink-1);font-weight:500;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  .cit-badge{
    display:inline-block;font-family:var(--font-mono);font-size:var(--fs-micro);
    color:var(--ink-3);background:none;border:1px solid var(--line-2);border-radius:4px;
    padding:0 5px;margin-right:0;
  }
  .cit-snippet{
    margin-top:5px;font-size:var(--fs-sm);color:var(--ink-2);line-height:1.75;
    padding-left:11px;border-left:1px solid var(--line);
  }
  .cit-mark{
    font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--accent);
    background:var(--accent-wash);border-radius:3px;padding:0 4px;margin:0 1px;
    vertical-align:1px;cursor:pointer;font-weight:400;
    transition:background var(--dur-1) var(--ease-out);
  }
  .cit-mark:hover{background:var(--accent-ring);text-decoration:none;}
  .cit-flash{border-left-color:var(--accent);background:var(--accent-wash);}

  /* ---- 欢迎区（空状态） ---- */
  .welcome{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--gutter);}
  .welcome .card{background:none;border:none;box-shadow:none;padding:0;max-width:660px;width:100%;text-align:center;}
  .welcome .icon{
    width:46px;height:46px;border-radius:var(--r-lg);margin:0 auto 20px;
    background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
    box-shadow:var(--e2);
  }
  .welcome h2{font-size:var(--fs-display);font-weight:500;letter-spacing:-.02em;color:var(--ink-1);margin-bottom:10px;}
  .welcome p{color:var(--ink-2);font-size:var(--fs-sm);line-height:1.8;}
  .welcome .rule{height:1px;background:var(--line);margin:28px 0;position:relative;}
  .welcome .rule::after{
    content:"试试这些问题";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:var(--surface);padding:0 14px;
    font-size:var(--fs-micro);color:var(--ink-3);letter-spacing:.12em;white-space:nowrap;
  }
  .welcome .hints{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:0;}
  .welcome .hint{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:14px 16px;font-size:var(--fs-sm);color:var(--ink-2);text-align:left;line-height:1.6;
    cursor:pointer;display:flex;align-items:flex-start;gap:10px;
    transition:border-color var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out),
               transform var(--dur-2) var(--ease-out),color var(--dur-2) var(--ease-out);
  }
  .welcome .hint:hover{border-color:var(--line-2);box-shadow:var(--e3);transform:translateY(-1px);color:var(--ink-1);}
  .welcome .hint i{font-style:normal;font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--ink-4);padding-top:2px;}

  /* ---- 输入区 ---- */
  .input-area{background:var(--surface);border-top:1px solid var(--line);padding:14px var(--gutter);}
  .composer-in{width:100%;}
  .box{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);
    padding:6px 6px 6px 16px;
    transition:border-color var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out);
  }
  .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);}
  .input-area input{
    flex:1;border:none;outline:none;background:none;font-size:var(--fs-body);
    color:var(--ink-1);padding:8px 0;min-width:0;
  }
  .input-area input::placeholder{color:var(--ink-4);}
  .input-area input:disabled{opacity:.5;}
  .input-area button{
    align-self:stretch;background:var(--accent);color:var(--on-accent);
    border-radius:var(--r-md);padding:0 22px;font-size:var(--fs-sm);font-weight:500;cursor:pointer;
    transition:background var(--dur-1) var(--ease-out);
  }
  .input-area button:hover{background:var(--accent-hover);}
  .input-area button:disabled{opacity:.5;cursor:not-allowed;}
  .composer-hint{margin-top:9px;text-align:center;font-size:var(--fs-micro);color:var(--ink-4);}

  /* ---- 登录/注册弹窗 ---- */
  .modal-mask{
    position:fixed;inset:0;background:rgba(13,17,23,.45);
    display:none;align-items:center;justify-content:center;z-index:100;
  }
  .modal-mask.open{display:flex;}
  .modal{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-lg);padding:26px 28px;width:340px;box-shadow:var(--e4);
  }
  .modal h3{font-size:var(--fs-h2);font-weight:500;letter-spacing:-.01em;margin-bottom:16px;}
  .modal .switch{display:flex;background:var(--surface-2);border-radius:var(--r-md);padding:3px;gap:3px;margin-bottom:16px;}
  .modal .switch button{
    flex:1;padding:7px;border-radius:5px;font-size:var(--fs-sm);color:var(--ink-3);
    transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out);
  }
  .modal .switch button.active{background:var(--surface);color:var(--ink-1);box-shadow:var(--e1);}
  .modal input{
    width:100%;border:1px solid var(--line-2);border-radius:var(--r-md);
    padding:10px 14px;font-size:var(--fs-sm);margin-bottom:10px;outline:none;
    background:var(--surface);color:var(--ink-1);
    transition:border-color var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out);
  }
  .modal input::placeholder{color:var(--ink-4);}
  .modal input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);}
  .modal .submit{
    width:100%;background:var(--accent);color:var(--on-accent);border:none;
    border-radius:var(--r-md);padding:11px;font-size:var(--fs-sm);font-weight:500;cursor:pointer;
    transition:background var(--dur-1) var(--ease-out);
  }
  .modal .submit:hover{background:var(--accent-hover);}
  .modal .err{color:var(--danger);font-size:var(--fs-xs);margin-bottom:8px;min-height:18px;}
  .modal .close{
    position:absolute;top:12px;right:14px;cursor:pointer;color:var(--ink-4);
    font-size:16px;line-height:1;background:none;transition:color var(--dur-1) var(--ease-out);
  }
  .modal .close:hover{color:var(--ink-1);}

  @media (max-width:900px){
    .sidebar{display:none;}
    .welcome .hints{grid-template-columns:1fr;}
    .msg{max-width:100%;}
  }
</style>
</head>
<body>

<!-- 侧边栏：品牌 + 新对话 + 历史 + 登录区 -->
<aside class="sidebar">
  <div class="brand">
    <span class="mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M12 7v13M8.5 20h7M7 7l-3 6h6zM17 7l-3 6h6z"/>
      </svg>
    </span>
    <span class="brand-txt"><b>劳动合规</b><em>RAG 问答平台</em></span>
  </div>

  <button class="new-chat" onclick="newChat()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    新对话
  </button>

  <div class="history-title" id="historyTitle">历史会话</div>
  <div class="history-list" id="historyList">
    <div class="history-empty">未登录状态，提问记录仅在当前页面保留。<br>登录后可长期保存并回看。</div>
  </div>

  <div class="auth-area" id="authArea">
    <button class="auth-btn" id="authBtn" onclick="openAuth()">登录 / 注册</button>
  </div>
</aside>

<div class="main">
  <header class="header">
    <h1>新对话</h1>
    <div class="kb-pick" id="kbPick" style="display:none">
      知识库
      <select id="kbSelect" onchange="onKbChange()" style="display:none"></select>
    </div>
    <span class="badge">13 部法规 · 805 条</span>
  </header>

  <main class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="card">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M12 7v13M8.5 20h7M7 7l-3 6h6zM17 7l-3 6h6z"/>
          </svg>
        </div>
        <h2>劳动争议智能问答</h2>
        <p>基于 13 部劳动与社会保障法律法规、805 条条文原文检索作答，<br>每条结论都标注出处，可直接溯源核对。</p>
        <div class="rule"></div>
        <div class="hints">
          <span class="hint"><i>01</i>公司拖欠我加班费怎么办</span>
          <span class="hint"><i>02</i>被辞退后经济补偿金怎么算</span>
          <span class="hint"><i>03</i>公司能收我押金或扣我身份证吗</span>
          <span class="hint"><i>04</i>试用期最长可以约定多久</span>
        </div>
      </div>
    </div>

  </main>

  <form class="input-area" id="inputForm" onsubmit="send(event)">
    <div class="composer-in">
      <div class="box">
        <input id="questionInput" type="text" placeholder="输入您的劳动争议问题…"
               autocomplete="off" autofocus>
        <button type="submit" id="sendBtn">发送</button>
      </div>
      <p class="composer-hint">基于 13 部法律法规 805 条条文作答 · 仅供参考，不构成法律意见</p>
    </div>
  </form>
</div>

<!-- 登录/注册弹窗 -->
<div class="modal-mask" id="authModal">
  <div class="modal">
    <button class="close" onclick="closeAuth()" aria-label="关闭">×</button>
    <h3 id="modalTitle">登录</h3>
    <div class="switch">
      <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
      <button id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>
    <div class="err" id="authErr"></div>
    <input id="authUser" type="text" placeholder="用户名（2-32 位）" autocomplete="username">
    <input id="authPass" type="password" placeholder="密码（4-64 位）" autocomplete="current-password">
    <button class="submit" id="authSubmitBtn" onclick="submitAuth()">登录</button>
  </div>
</div>

<!-- 外观面板 -->
<div class="tw" id="tw" data-open="false">
  <button class="tw-fab" id="twFab" aria-label="外观设置">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>
  </button>
  <div class="tw-panel">
    <h3>外观</h3>
    <div class="tw-row">
      <label>主题</label>
      <div class="seg" data-key="theme">
        <button data-val="cool" aria-pressed="true">冷白工具</button>
        <button data-val="dark" aria-pressed="false">深墨暗色</button>
      </div>
    </div>
    <div class="tw-row">
      <label>信息密度</label>
      <div class="seg" data-key="density">
        <button data-val="comfortable" aria-pressed="true">舒适</button>
        <button data-val="compact" aria-pressed="false">紧凑</button>
      </div>
    </div>
    <p class="tw-note">主题与密度会记住，三页共用。</p>
  </div>
</div>

<script src="/common.js"></script>
<script src="/theme.js"></script>
<script>
// ===== DOM 引用 =====
const chatArea = document.getElementById('chatArea');
const welcome   = document.getElementById('welcome');
const input     = document.getElementById('questionInput');
const sendBtn   = document.getElementById('sendBtn');
const historyList = document.getElementById('historyList');
const historyTitle = document.getElementById('historyTitle');

let currentProgressMsg = null;   // 当前进度消息 DOM（用于更新文本）
let streamBubble = null;         // 流式回答的助手气泡 DOM（token 逐段累积进去）
let streamText = '';             // 流式回答已收到文本（done 前不断累加）
let currentMode = 'login';       // 弹窗当前 tab
let currentSessionId = null;     // 登录用户当前会话 id；null = 尚未建会话（提问时自动建）
let guestHistory = [];           // 游客本页多轮上下文 [{role, content}]（关页即没）

let lastQuestion = '';           // 最近一次提问（finishDone 记录游客上下文用）

// token/角色/escapeHTML 等公共工具由 common.js 提供（与 login/kb 页共用同一份）

// ===== 知识库选择器（仅登录用户显示；游客固定用默认库）=====
async function loadKbs() {
  const sel = document.getElementById('kbSelect');
  const pick = document.getElementById('kbPick');
  if (!getToken()) { pick.style.display = 'none'; return; }
  try {
    const data = await api('/kb', { no401: true });
    const kbs = data.kbs || [];
    sel.textContent = '';
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = '全部可见知识库';
    sel.appendChild(allOpt);
    for (const kb of kbs) {
      const opt = document.createElement('option');
      opt.value = String(kb.id);
      opt.textContent = kb.name + (kb.is_public ? '（公开）' : '');
      sel.appendChild(opt);
    }
    sel.value = currentKbId ? String(currentKbId) : '';
    sel.style.display = '';
    pick.style.display = '';
  } catch (e) { /* 401/网络异常：静默，游客路径不受影响 */ }
}

/** 换库 = 换语境：旧会话绑定的库不会跟着变，直接开新对话最不容易误会 */
function onKbChange() {
  const v = document.getElementById('kbSelect').value;
  currentKbId = v ? Number(v) : null;
  if (currentSessionId) newChat();
}

// ===== 登录 / 注册 =====
function openAuth() {
  document.getElementById('authModal').classList.add('open');
  document.getElementById('authErr').textContent = '';
}

function closeAuth() {
  document.getElementById('authModal').classList.remove('open');
}

function switchTab(mode) {
  currentMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('modalTitle').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('authSubmitBtn').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('authErr').textContent = '';
}

async function submitAuth() {
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const errEl = document.getElementById('authErr');

  if (!username || !password) { errEl.textContent = '请填写用户名和密码'; return; }

  try {
    const path = currentMode === 'login' ? '/auth/login' : '/auth/register';
    const resp = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      errEl.textContent = data.detail || '请求失败';
      return;
    }

    // 登录成功：存 token + 角色（角色只用于显示入口，真正的边界在后端 require_admin）
    localStorage.setItem('lcr_token', data.token);
    localStorage.setItem('lcr_username', data.username);
    localStorage.setItem('lcr_role', data.role || 'user');
    currentUsername = data.username;
    currentSessionId = null;
    currentKbId = null;
    closeAuth();
    renderAuthArea();
    newChat();
    loadSessions();
    loadKbs();
  } catch (e) {
    errEl.textContent = '网络错误：' + e.message;
  }
}

function logout() {
  localStorage.removeItem('lcr_token');
  localStorage.removeItem('lcr_username');
  localStorage.removeItem('lcr_role');
  currentUsername = null;
  currentSessionId = null;
  currentKbId = null;
  guestHistory = [];
  document.getElementById('kbPick').style.display = 'none';
  renderAuthArea();
  newChat();
  renderHistoryEmpty();
}

// ===== 侧边栏：登录用户 = 会话列表；游客 = 提示 =====
function renderHistoryEmpty() {
  historyTitle.textContent = '历史会话';
  historyList.innerHTML = `
    <div class="history-empty">未登录状态，提问记录仅在当前页面保留。<br>登录后可长期保存并回看。</div>`;
}

async function loadSessions() {
  if (!getToken()) { renderHistoryEmpty(); return; }
  try {
    const resp = await fetch('/chat/sessions', {
      headers: { Authorization: 'Bearer ' + getToken() },
    });
    if (!resp.ok) { renderHistoryEmpty(); return; }
    const data = await resp.json();
    const sessions = data.sessions || [];
    historyTitle.textContent = `历史会话（${sessions.length}）`;
    if (sessions.length === 0) {
      historyList.innerHTML = `<div class="history-empty">还没有历史提问，去问一条吧。</div>`;
      return;
    }
    historyList.innerHTML = '';
    for (const s of sessions) {
      const div = document.createElement('div');
      div.className = 'history-item';
      if (s.id === currentSessionId) div.classList.add('active');
      div.textContent = s.title || '新对话';
      div.title = s.title;
      div.onclick = () => openSession(s);
      historyList.appendChild(div);
    }
  } catch (e) { /* 网络异常 */ }
}

/** 点开某会话：拉取全部多轮消息并渲染到消息区（s 带 kb_id，用于同步选择器） */
async function openSession(session) {
  const sessionId = session.id;
  if (!getToken()) return;
  try {
    const resp = await fetch(`/chat/sessions/${sessionId}/messages`, {
      headers: { Authorization: 'Bearer ' + getToken() },
    });
    if (!resp.ok) return;
    const data = await resp.json();
    currentSessionId = sessionId;
    // 会话绑定的库优先：把 header 选择器同步过去，避免"下一问问到别的库"的错位
    if (session.kb_id) {
      currentKbId = session.kb_id;
      const sel = document.getElementById('kbSelect');
      if (sel && sel.style.display !== 'none') sel.value = String(session.kb_id);
    }
    renderMsgs(data.messages || []);
    loadSessions();
  } catch (e) { /* 网络异常 */ }
}

/** 把一组消息渲染进消息区（多轮历史回显 / 直接展示均可复用） */
function renderMsgs(msgs) {
  if (welcome) welcome.style.display = 'none';
  chatArea.querySelectorAll('.msg').forEach(m => m.remove());
  if (!msgs.length) {
    if (welcome) welcome.style.display = 'flex';
    return;
  }
  for (const m of msgs) {
    if (m.role === 'user') {
      addBubble('user', currentUsername ? currentUsername : '您', m.content);
    } else {
      const div = addBubble('assistant', '助手', m.content || '（无回答）');
      renderAnswerText(div.querySelector('.bubble'), m.content || '');
      attachCitations(div, m.citations || []);
    }
  }
  chatArea.scrollTop = chatArea.scrollHeight;
}

/**
 * 把答案文本渲染进气泡：只把 [n] 角标变成可点元素，其余一律用纯文本节点插入。
 * 用 createTextNode 而不是 innerHTML——LLM 输出是不可信输入，不能当 HTML 解析。
 */
function renderAnswerText(bubbleEl, text) {
  bubbleEl.textContent = '';
  const re = /\[(\d{1,3})\]/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) {
      bubbleEl.appendChild(document.createTextNode(text.slice(last, m.index)));
    }
    const n = Number(m[1]);
    const sup = document.createElement('sup');
    sup.className = 'cit-mark';
    sup.dataset.idx = String(n);
    sup.textContent = '[' + n + ']';
    sup.title = '查看引用 ' + n;
    sup.addEventListener('click', function () { focusCitation(bubbleEl, n); });
    bubbleEl.appendChild(sup);
    last = m.index + m[0].length;
  }
  if (last < text.length) {
    bubbleEl.appendChild(document.createTextNode(text.slice(last)));
  }
}

/** 点角标：滚动到第 n 张引用卡片并闪一下 */
function focusCitation(bubbleEl, n) {
  const card = bubbleEl.querySelector('.cit-card[data-idx="' + n + '"]');
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.add('cit-flash');
  setTimeout(function () { card.classList.remove('cit-flash'); }, 1200);
}

/** 给助手气泡挂引用卡片（文档名 · 第 N 条/段 · 相关度，含片段） */
function attachCitations(div, citations) {
  if (!citations || citations.length === 0) return;
  const details = document.createElement('details');
  details.className = 'citations';
  details.open = true;
  const summary = document.createElement('summary');
  summary.textContent = '引用来源 · ' + citations.length + ' 条';
  details.appendChild(summary);

  const list = document.createElement('ol');
  list.className = 'cit-list';
  citations.forEach(function (c, i) {
    const idx = i + 1;
    const li = document.createElement('li');
    li.className = 'cit-card';
    li.dataset.idx = String(idx);

    const head = document.createElement('div');
    head.className = 'cit-head';
    const badge = document.createElement('span');
    badge.className = 'cit-badge';
    badge.textContent = '[' + idx + ']';
    head.appendChild(badge);
    head.appendChild(document.createTextNode(citeTitle(c) + ' ' + citeMeta(c)));
    li.appendChild(head);

    if (c.snippet) {
      const p = document.createElement('div');
      p.className = 'cit-snippet';
      p.textContent = c.snippet;
      li.appendChild(p);
    }
    list.appendChild(li);
  });
  details.appendChild(list);
  div.querySelector('.bubble').appendChild(details);
}

/** 引用标题：新格式用文档名；改造前的老数据回退到 law_id 的中文名 */
function citeTitle(c) {
  if (c.doc_title) return '《' + c.doc_title + '》';
  if (c.law_id) return '《' + lawName(c.law_id) + '》';
  return '（未知来源）';
}

/** 引用定位与相关度：内置法条说"第 N 条"，上传长文档说"第 N 段" */
function citeMeta(c) {
  const seq = (c.seq != null) ? c.seq : c.article_no;
  if (seq == null) return '';
  // source_law_id 或老格式的 law_id 存在 → 是法条；否则是文档片段
  const isArticle = !!(c.source_law_id || (!c.doc_id && c.law_id));
  let s = '第 ' + seq + ' ' + (isArticle ? '条' : '段');
  const heading = c.heading || c.chapter;
  if (heading) s += ' · ' + heading;
  if (typeof c.score === 'number') s += ' · 相关度 ' + c.score.toFixed(2);
  return s;
}

// ===== 新对话：游客/登录都清空当前，游客重置内存上下文，登录等下次提问自动建会话 =====
function newChat() {
  chatArea.querySelectorAll('.msg').forEach(m => m.remove());
  if (welcome) welcome.style.display = 'flex';
  chatArea.scrollTop = 0;
  setSending(false);
  currentSessionId = null;
  guestHistory = [];
  historyList.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
}

// ===== 发送消息 =====
function sendHint(text) { input.value = text; send(new Event('submit')); }

function send(e) {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  lastQuestion = question;

  if (welcome) welcome.style.display = 'none';

  addBubble('user', currentUsername || '您', question);

  // 新请求开始：清空上一轮的流式渲染状态，先展示"正在理解"进度气泡
  streamBubble = null;
  streamText = '';
  currentProgressMsg = addBubble('progress', '助手', '正在理解您的问题...');
  setSending(true);

  fetchSSE(question);
}

/**
 * 用 fetch POST 发送问题，手动解析 SSE 流。
 * 不能用 EventSource：它只发 GET，而 /chat 是 POST 路由。
 *
 * 登录用户：带 session_id（null → 后端自动建会话并在 done 帧回 session_id）；
 * 游客：带上本页多轮上下文 guestHistory，关页即没。
 */
async function fetchSSE(question) {
  try {
    const headers = { 'Content-Type': 'application/json' };
    let body = { question };
    if (getToken()) {
      headers.Authorization = 'Bearer ' + getToken();
      body.session_id = currentSessionId;
      if (currentKbId) body.kb_id = currentKbId;
    } else {
      body.history = guestHistory;
    }

    const resp = await fetch('/chat', {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      updateProgress('请求失败：' + (err.detail || resp.statusText));
      setSending(false);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split('\n\n');
      buffer = parts.pop() || '';

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data: ')) continue;
        try {
          const frame = JSON.parse(line.slice(6));
          handleFrame(frame);
        } catch (e) { /* 非 JSON 帧忽略 */ }
      }
    }

    // 登录用户：回答完成（done 帧已记入 currentSessionId）后刷新会话列表
    if (getToken()) loadSessions();
  } catch (e) {
    updateProgress('网络错误：' + e.message);
    setSending(false);
  }
}

/** 处理单个 SSE 帧 */
function handleFrame(frame) {
  const stageMap = {
    rewriting: '正在理解您的问题...',
    searching: '正在检索相关法律条文...',
    verifying: '正在核验条文与问题的相关性...',
    answering: '正在整理回答...',
    refusing:  '检索到的条文不足以支持明确结论，建议咨询专业劳动法律师',
  };

  switch (frame.stage) {
    case 'rewriting':
    case 'searching':
    case 'verifying':
    case 'answering':
      updateProgress(frame.content || stageMap[frame.stage]);
      break;
    case 'refusing':
      updateProgress(frame.content || stageMap.refusing);
      break;
    case 'token':
      streamToken(frame.content);
      break;
    case 'done':
      finishDone(frame);
      break;
    case 'error':
      finishError(frame);
      break;
  }
}

/** 更新进度消息文本 */
function updateProgress(text) {
  if (currentProgressMsg) {
    currentProgressMsg.querySelector('.bubble').textContent = text;
  }
}

/**
 * token 帧：LLM 回答的一段增量 → 打字机式累积进助手气泡。
 * 首个 token 到达意味着"进度阶段结束、回答开始"，把进度气泡升级成正式回答气泡。
 * 用 textContent 赋值（不拼 innerHTML），天然转义 LLM 输出里的 < > &，防注入。
 */
function streamToken(text) {
  if (currentProgressMsg) { currentProgressMsg.remove(); currentProgressMsg = null; }
  if (!streamBubble) {
    streamBubble = addBubble('assistant', '助手', '');
  }
  streamText += text;
  streamBubble.querySelector('.bubble').textContent = streamText;
  chatArea.scrollTop = chatArea.scrollHeight;
}

/** done 帧：收尾回答——若流式渲染过则复用该气泡，否则新建；挂引用、记历史 */
function finishDone(frame) {
  if (currentProgressMsg) { currentProgressMsg.remove(); currentProgressMsg = null; }
  setSending(false);

  let payload;
  try { payload = JSON.parse(frame.content); }
  catch (e) {
    // done 帧不是合法 JSON（不应发生）：丢弃半成品流式气泡，降级为普通气泡展示原文
    if (streamBubble) { streamBubble.remove(); streamBubble = null; }
    streamText = '';
    addBubble('assistant', '助手', frame.content || '（空回答）');
    return;
  }

  // 登录：首次提问后端会新建会话，done 帧回传 session_id，记作当前会话
  if (getToken() && payload.session_id) {
    currentSessionId = payload.session_id;
  }
  // 游客：把本轮问答推进多轮上下文（关页即没）；只留最近若干轮防膨胀
  if (!getToken()) {
    guestHistory.push({ role: 'user', content: lastQuestion });
    guestHistory.push({ role: 'assistant', content: payload.answer || '（空回答）' });
    if (guestHistory.length > 12) guestHistory.splice(0, guestHistory.length - 12);
  }

  if (payload.refuse) {
    // 拒答不产生 token 流，正常不应有半成品气泡；稳妥起见仍清理
    if (streamBubble) { streamBubble.remove(); streamBubble = null; }
    streamText = '';
    addBubble('assistant', '助手', payload.answer || '抱歉，无法就该问题给出明确结论。');
    return;
  }

  // 有流式气泡 → 复用，把服务端权威的完整答案写回（覆盖可能的半句/尾随字符），再挂引用
  let div = streamBubble;
  if (!div) {
    div = addBubble('assistant', '助手', payload.answer || '（空回答）');
  }
  // 流式期间是纯文本累积；收尾时再渲染一次，把 [n] 升级成可点角标
  renderAnswerText(div.querySelector('.bubble'), payload.answer || '（空回答）');
  streamBubble = null;
  streamText = '';
  attachCitations(div, payload.citations || []);
}

/** error 帧：移除进度消息与半成品流式气泡，显示错误 */
function finishError(frame) {
  if (currentProgressMsg) { currentProgressMsg.remove(); currentProgressMsg = null; }
  if (streamBubble) { streamBubble.remove(); streamBubble = null; }
  streamText = '';
  setSending(false);

  let detail = frame.content || '未知错误';
  try {
    const err = JSON.parse(frame.content);
    detail = err.detail || err.error || frame.content;
  } catch (e) { /* 不是 JSON，直接用原文 */ }

  addBubble('assistant error', '助手', detail);
}

/** 添加一条消息气泡，返回其 DOM 元素 */
const ASST_MARK = '<span class="lm"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M12 7v13M8.5 20h7M7 7l-3 6h6zM17 7l-3 6h6z"/></svg></span>';

function addBubble(cls, label, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  const mark = cls.indexOf('user') === 0 ? '' : ASST_MARK;
  div.innerHTML =
    '<div class="label">' + mark + escapeHTML(label) + '</div>' +
    '<div class="bubble">' + escapeHTML(text) + '</div>';
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

/** 设置发送状态 */
function setSending(disabled) {
  input.disabled = disabled;
  sendBtn.disabled = disabled;
  sendBtn.textContent = disabled ? '发送中...' : '发送';
  if (!disabled) { input.value = ''; input.focus(); }
}

/** law_id（英文 slug）→ 中文法律名，用于展示 */
const LAW_NAME = {
  labor_law: '劳动法',
  labor_contract_law: '劳动合同法',
};

function lawName(lawId) {
  return LAW_NAME[lawId] || lawId;
}

/** 基础 HTML 转义 */
function escapeHTML(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
