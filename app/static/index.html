<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劳动争议智能合规助手</title>
<style>
  :root {
    /* 用户拍板配色：浅灰侧边栏 + 纯白消息区 */
    --sidebar-bg: #f2f3f5;
    --bg: #ffffff;
    --card: #ffffff;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --text: #1e1b4b;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --user-bubble: #4f46e5;
    --assistant-bubble: #f7f8fa;
    --progress-bubble: #eef0f3;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--sidebar-bg);
    color: var(--text);
    height: 100vh; display: flex;
  }

  /* ---- 左侧边栏（浅灰）---- */
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px; padding: 16px 12px;
  }
  .sidebar .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; padding: 4px 8px 10px; }
  .sidebar .brand .logo { font-size: 20px; }
  .new-chat {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; text-align: left; cursor: pointer; font-size: 14px;
    transition: border-color .15s;
  }
  .new-chat:hover { border-color: var(--primary); }
  .history-title { font-size: 12px; color: var(--text-muted); padding: 10px 8px 4px; }
  .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .history-empty {
    padding: 16px 8px; font-size: 13px; color: var(--text-muted);
    text-align: center; line-height: 1.6;
  }
  .history-item {
    padding: 8px 10px; border-radius: 8px; font-size: 14px; cursor: pointer;
    color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .15s;
  }
  .history-item:hover { background: #e9eaee; }
  .history-item.active { background: #fff; color: var(--text); box-shadow: var(--shadow); }

  /* 左下角登录区 */
  .auth-area {
    border-top: 1px solid var(--border); padding: 12px 8px 4px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .auth-btn {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; font-size: 14px; cursor: pointer; text-align: center;
    transition: border-color .15s;
  }
  .auth-btn:hover { border-color: var(--primary); }
  .auth-user {
    font-size: 13px; color: var(--text-muted); padding: 4px 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .auth-user .logout-btn { color: var(--primary); cursor: pointer; font-size: 12px; }

  /* ---- 右侧主区（纯白）---- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }

  .header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; gap: 10px; z-index: 10;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .badge {
    font-size: 11px; background: #eef2ff; color: var(--primary);
    padding: 3px 10px; border-radius: 99px; margin-left: auto;
  }

  .chat-area {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .msg { display: flex; flex-direction: column; max-width: 80%; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg .label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .msg.user .label { text-align: right; }
  .msg .bubble { padding: 12px 16px; border-radius: var(--radius); line-height: 1.65; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.progress .bubble { background: var(--progress-bubble); color: var(--text-muted); border: 1px dashed var(--border); font-size: 14px; }

  .citations { margin-top: 10px; padding: 10px 14px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; font-size: 13px; }
  .citations summary { cursor: pointer; font-weight: 600; color: #166534; }
  .citations ul { margin-top: 6px; padding-left: 18px; }
  .citations li { margin-bottom: 4px; color: var(--text); }
  .citations code { background: #d1fae5; padding: 1px 6px; border-radius: 4px; font-size: 12px; }

  /* 欢迎区（空状态） */
  .welcome { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .welcome .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 40px 48px; box-shadow: var(--shadow); text-align: center; max-width: 640px;
  }
  .welcome .icon { font-size: 52px; margin-bottom: 14px; }
  .welcome h2 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .welcome p { color: var(--text-muted); font-size: 14px; line-height: 1.7; }
  .welcome .hints { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; justify-content: center; }
  .welcome .hint {
    background: #f7f8fa; border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 16px; font-size: 14px; cursor: pointer; transition: border-color .15s;
  }
  .welcome .hint:hover { border-color: var(--primary); }

  /* ---- 输入区 ---- */
  .input-area {
    background: var(--card); border-top: 1px solid var(--border);
    padding: 16px 24px; display: flex; gap: 10px;
  }
  .input-area input {
    flex: 1; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; font-size: 15px; outline: none; background: #f7f8fa;
    transition: border-color .15s, background .15s;
  }
  .input-area input:focus { border-color: var(--primary); background: #fff; }
  .input-area input:disabled { background: #f3f4f6; }
  .input-area button {
    background: var(--primary); color: #fff; border: none; border-radius: var(--radius);
    padding: 12px 26px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  .input-area button:hover { background: var(--primary-hover); }
  .input-area button:disabled { opacity: .5; cursor: not-allowed; }

  /* ---- 登录/注册弹窗 ---- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 28px 32px; width: 340px;
    box-shadow: 0 10px 40px rgba(0,0,0,.15);
  }
  .modal h3 { font-size: 18px; margin-bottom: 16px; }
  .modal .switch { display: flex; gap: 8px; margin-bottom: 16px; }
  .modal .switch button {
    flex: 1; padding: 8px; border: 1px solid var(--border); background: #fff;
    border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text-muted);
  }
  .modal .switch button.active { border-color: var(--primary); color: var(--primary); background: #eef2ff; }
  .modal input {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; margin-bottom: 10px; outline: none;
  }
  .modal input:focus { border-color: var(--primary); }
  .modal .submit {
    width: 100%; background: var(--primary); color: #fff; border: none;
    border-radius: 10px; padding: 11px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .modal .submit:hover { background: var(--primary-hover); }
  .modal .err { color: #dc2626; font-size: 13px; margin-bottom: 8px; min-height: 18px; }
  .modal .close { position: absolute; top: 14px; right: 18px; cursor: pointer; color: var(--text-muted); font-size: 18px; }

  @media (max-width: 768px) { .sidebar { display: none; } }
</style>
</head>
<body>

<!-- 左侧边栏（浅灰）：新对话 + 用户历史（登录后） + 左下角登录区 -->
<aside class="sidebar">
  <div class="brand"><span class="logo">⚖️</span>劳动合规 RAG</div>
  <button class="new-chat" onclick="newChat()">＋ 新对话</button>
  <div class="history-title" id="historyTitle">历史会话</div>
  <div class="history-list" id="historyList">
    <div class="history-empty">未登录状态，提问记录仅在当前页面保留。<br>登录后可长期保存并回看。</div>
  </div>
  <div class="auth-area" id="authArea">
    <button class="auth-btn" id="authBtn" onclick="openAuth()">登录 / 注册</button>
  </div>
</aside>

<div class="main">
  <header class="header">
    <h1>新对话</h1>
    <span class="badge">RAG · 检索增强生成</span>
  </header>

  <main class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="card">
        <div class="icon">⚖️</div>
        <h2>劳动争议智能问答</h2>
        <p>基于《劳动法》《劳动合同法》原文，检索相关条款并给出带条文引用的回答。</p>
        <div class="hints">
          <span class="hint" onclick="sendHint(this.textContent)">公司拖欠我加班费怎么办</span>
          <span class="hint" onclick="sendHint(this.textContent)">被辞退后经济补偿金怎么算</span>
          <span class="hint" onclick="sendHint(this.textContent)">公司能收我押金或扣我身份证吗</span>
          <span class="hint" onclick="sendHint(this.textContent)">试用期最长可以约定多久</span>
        </div>
      </div>
    </div>
  </main>

  <form class="input-area" id="inputForm" onsubmit="send(event)">
    <input id="questionInput" type="text" placeholder="输入您的劳动争议问题..."
           autocomplete="off" autofocus>
    <button type="submit" id="sendBtn">发送</button>
  </form>
</div>

<!-- 登录/注册弹窗 -->
<div class="modal-mask" id="authModal">
  <div class="modal" style="position:relative">
    <span class="close" onclick="closeAuth()">✕</span>
    <h3 id="modalTitle">登录</h3>
    <div class="switch">
      <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
      <button id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>
    <div class="err" id="authErr"></div>
    <input id="authUser" type="text" placeholder="用户名（2-32 位）" autocomplete="username">
    <input id="authPass" type="password" placeholder="密码（4-64 位）" autocomplete="current-password">
    <button class="submit" id="authSubmitBtn" onclick="submitAuth()">登录</button>
  </div>
</div>

<script>
// ===== DOM 引用 =====
const chatArea = document.getElementById('chatArea');
const welcome   = document.getElementById('welcome');
const input     = document.getElementById('questionInput');
const sendBtn   = document.getElementById('sendBtn');
const historyList = document.getElementById('historyList');
const historyTitle = document.getElementById('historyTitle');
const authBtn   = document.getElementById('authBtn');
const authArea  = document.getElementById('authArea');

let currentProgressMsg = null;   // 当前进度消息 DOM（用于更新文本）
let currentMode = 'login';       // 弹窗当前 tab
let currentSessionId = null;     // 登录用户当前会话 id；null = 尚未建会话（提问时自动建）
let guestHistory = [];           // 游客本页多轮上下文 [{role, content}]（关页即没）
let currentUsername = null;      // 当前登录用户名（用于气泡标签）
let lastQuestion = '';           // 最近一次提问（finishDone 记录游客上下文用）

// ===== token 管理（存 localStorage：刷新页面不丢登录态）=====
function getToken() { return localStorage.getItem('lcr_token') || ''; }
function getUsername() { return localStorage.getItem('lcr_username') || ''; }

// ===== 登录 / 注册 =====
function openAuth() {
  document.getElementById('authModal').classList.add('open');
  document.getElementById('authErr').textContent = '';
}

function closeAuth() {
  document.getElementById('authModal').classList.remove('open');
}

function switchTab(mode) {
  currentMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('modalTitle').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('authSubmitBtn').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('authErr').textContent = '';
}

async function submitAuth() {
  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const errEl = document.getElementById('authErr');

  if (!username || !password) { errEl.textContent = '请填写用户名和密码'; return; }

  try {
    const path = currentMode === 'login' ? '/auth/login' : '/auth/register';
    const resp = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      errEl.textContent = data.detail || '请求失败';
      return;
    }

    // 登录成功：存 token，关闭弹窗，进入新对话、刷新侧边栏会话列表
    localStorage.setItem('lcr_token', data.token);
    localStorage.setItem('lcr_username', data.username);
    currentUsername = data.username;
    currentSessionId = null;
    closeAuth();
    renderAuthArea();
    newChat();
    loadSessions();
  } catch (e) {
    errEl.textContent = '网络错误：' + e.message;
  }
}

function logout() {
  localStorage.removeItem('lcr_token');
  localStorage.removeItem('lcr_username');
  currentUsername = null;
  currentSessionId = null;
  guestHistory = [];
  renderAuthArea();
  newChat();
  renderHistoryEmpty();
}

function renderAuthArea() {
  const username = getUsername();
  if (username) {
    authArea.innerHTML = `
      <div class="auth-user">
        <span>👤 ${escapeHTML(username)}</span>
        <span class="logout-btn" onclick="logout()">登出</span>
      </div>`;
  } else {
    authArea.innerHTML = `<button class="auth-btn" onclick="openAuth()">登录 / 注册</button>`;
  }
}

// 页面加载时恢复登录态
currentUsername = getUsername();
renderAuthArea();
if (getToken()) loadSessions();

// ===== 侧边栏：登录用户 = 会话列表；游客 = 提示 =====
function renderHistoryEmpty() {
  historyTitle.textContent = '历史会话';
  historyList.innerHTML = `
    <div class="history-empty">未登录状态，提问记录仅在当前页面保留。<br>登录后可长期保存并回看。</div>`;
}

async function loadSessions() {
  if (!getToken()) { renderHistoryEmpty(); return; }
  try {
    const resp = await fetch('/chat/sessions', {
      headers: { Authorization: 'Bearer ' + getToken() },
    });
    if (!resp.ok) { renderHistoryEmpty(); return; }
    const data = await resp.json();
    const sessions = data.sessions || [];
    historyTitle.textContent = `历史会话（${sessions.length}）`;
    if (sessions.length === 0) {
      historyList.innerHTML = `<div class="history-empty">还没有历史提问，去问一条吧。</div>`;
      return;
    }
    historyList.innerHTML = '';
    for (const s of sessions) {
      const div = document.createElement('div');
      div.className = 'history-item';
      if (s.id === currentSessionId) div.classList.add('active');
      div.textContent = s.title || '新对话';
      div.title = s.title;
      div.onclick = () => openSession(s.id);
      historyList.appendChild(div);
    }
  } catch (e) { /* 网络异常 */ }
}

/** 点开某会话：拉取全部多轮消息并渲染到消息区 */
async function openSession(sessionId) {
  if (!getToken()) return;
  try {
    const resp = await fetch(`/chat/sessions/${sessionId}/messages`, {
      headers: { Authorization: 'Bearer ' + getToken() },
    });
    if (!resp.ok) return;
    const data = await resp.json();
    currentSessionId = sessionId;
    renderMsgs(data.messages || []);
    loadSessions();
  } catch (e) { /* 网络异常 */ }
}

/** 把一组消息渲染进消息区（多轮历史回显 / 直接展示均可复用） */
function renderMsgs(msgs) {
  if (welcome) welcome.style.display = 'none';
  chatArea.querySelectorAll('.msg').forEach(m => m.remove());
  if (!msgs.length) {
    if (welcome) welcome.style.display = 'flex';
    return;
  }
  for (const m of msgs) {
    if (m.role === 'user') {
      addBubble('user', currentUsername ? currentUsername : '您', m.content);
    } else {
      const div = addBubble('assistant', '⚖️ 助手', m.content || '（无回答）');
      attachCitations(div, m.citations || []);
    }
  }
  chatArea.scrollTop = chatArea.scrollHeight;
}

/** 给助手气泡挂引用列表 */
function attachCitations(div, citations) {
  if (!citations || citations.length === 0) return;
  const details = document.createElement('details');
  details.className = 'citations';
  details.open = true;
  const summary = document.createElement('summary');
  summary.textContent = `📋 引用法律条文（${citations.length} 条）`;
  details.appendChild(summary);
  const ul = document.createElement('ul');
  for (const c of citations) {
    const li = document.createElement('li');
    li.innerHTML = `<code>《${lawName(c.law_id)}》第${c.article_no}条</code>`;
    if (c.chapter) li.innerHTML += ` <small>（${c.chapter}）</small>`;
    ul.appendChild(li);
  }
  details.appendChild(ul);
  div.querySelector('.bubble').appendChild(details);
}

// ===== 新对话：游客/登录都清空当前，游客重置内存上下文，登录等下次提问自动建会话 =====
function newChat() {
  chatArea.querySelectorAll('.msg').forEach(m => m.remove());
  if (welcome) welcome.style.display = 'flex';
  chatArea.scrollTop = 0;
  setSending(false);
  currentSessionId = null;
  guestHistory = [];
  historyList.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
}

// ===== 发送消息 =====
function sendHint(text) { input.value = text; send(new Event('submit')); }

function send(e) {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  lastQuestion = question;

  if (welcome) welcome.style.display = 'none';

  addBubble('user', currentUsername || '您', question);

  currentProgressMsg = addBubble('progress', '⚖️ 助手', '正在理解您的问题...');
  setSending(true);

  fetchSSE(question);
}

/**
 * 用 fetch POST 发送问题，手动解析 SSE 流。
 * 不能用 EventSource：它只发 GET，而 /chat 是 POST 路由。
 *
 * 登录用户：带 session_id（null → 后端自动建会话并在 done 帧回 session_id）；
 * 游客：带上本页多轮上下文 guestHistory，关页即没。
 */
async function fetchSSE(question) {
  try {
    const headers = { 'Content-Type': 'application/json' };
    let body = { question };
    if (getToken()) {
      headers.Authorization = 'Bearer ' + getToken();
      body.session_id = currentSessionId;
    } else {
      body.history = guestHistory;
    }

    const resp = await fetch('/chat', {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      updateProgress('❌ 请求失败: ' + (err.detail || resp.statusText));
      setSending(false);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split('\n\n');
      buffer = parts.pop() || '';

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data: ')) continue;
        try {
          const frame = JSON.parse(line.slice(6));
          handleFrame(frame);
        } catch (e) { /* 非 JSON 帧忽略 */ }
      }
    }

    // 登录用户：回答完成（done 帧已记入 currentSessionId）后刷新会话列表
    if (getToken()) loadSessions();
  } catch (e) {
    updateProgress('❌ 网络错误: ' + e.message);
    setSending(false);
  }
}

/** 处理单个 SSE 帧 */
function handleFrame(frame) {
  const stageMap = {
    rewriting: '正在理解您的问题...',
    searching: '正在检索相关法律条文...',
    verifying: '正在核验条文与问题的相关性...',
    answering: '正在整理回答...',
    refusing:  '检索到的条文不足以支持明确结论，建议咨询专业劳动法律师',
  };

  switch (frame.stage) {
    case 'rewriting':
    case 'searching':
    case 'verifying':
    case 'answering':
      updateProgress(frame.content || stageMap[frame.stage]);
      break;
    case 'refusing':
      updateProgress(frame.content || stageMap.refusing);
      break;
    case 'done':
      finishDone(frame);
      break;
    case 'error':
      finishError(frame);
      break;
  }
}

/** 更新进度消息文本 */
function updateProgress(text) {
  if (currentProgressMsg) {
    currentProgressMsg.querySelector('.bubble').textContent = text;
  }
}

/** done 帧：移除进度消息，显示最终回答 + 引用 */
function finishDone(frame) {
  if (currentProgressMsg) { currentProgressMsg.remove(); currentProgressMsg = null; }
  setSending(false);

  let payload;
  try { payload = JSON.parse(frame.content); }
  catch (e) {
    addBubble('assistant', '⚖️ 助手', frame.content || '（空回答）');
    return;
  }

  // 登录：首次提问后端会新建会话，done 帧回传 session_id，记作当前会话
  if (getToken() && payload.session_id) {
    currentSessionId = payload.session_id;
  }
  // 游客：把本轮问答推进多轮上下文（关页即没）；只留最近若干轮防膨胀
  if (!getToken()) {
    guestHistory.push({ role: 'user', content: lastQuestion });
    guestHistory.push({ role: 'assistant', content: payload.answer || '（空回答）' });
    if (guestHistory.length > 12) guestHistory.splice(0, guestHistory.length - 12);
  }

  if (payload.refuse) {
    addBubble('assistant', '⚖️ 助手', payload.answer || '抱歉，无法就该问题给出明确结论。');
    return;
  }

  const div = addBubble('assistant', '⚖️ 助手', payload.answer || '（空回答）');
  attachCitations(div, payload.citations || []);
}

/** error 帧：移除进度消息，显示错误 */
function finishError(frame) {
  if (currentProgressMsg) { currentProgressMsg.remove(); currentProgressMsg = null; }
  setSending(false);

  let detail = frame.content || '未知错误';
  try {
    const err = JSON.parse(frame.content);
    detail = err.detail || err.error || frame.content;
  } catch (e) { /* 不是 JSON，直接用原文 */ }

  addBubble('assistant', '⚖️ 助手', '❌ ' + detail);
}

/** 添加一条消息气泡，返回其 DOM 元素 */
function addBubble(cls, label, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = `
    <div class="label">${label}</div>
    <div class="bubble">${escapeHTML(text)}</div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

/** 设置发送状态 */
function setSending(disabled) {
  input.disabled = disabled;
  sendBtn.disabled = disabled;
  sendBtn.textContent = disabled ? '发送中...' : '发送';
  if (!disabled) { input.value = ''; input.focus(); }
}

/** law_id（英文 slug）→ 中文法律名，用于展示 */
const LAW_NAME = {
  labor_law: '劳动法',
  labor_contract_law: '劳动合同法',
};

function lawName(lawId) {
  return LAW_NAME[lawId] || lawId;
}

/** 基础 HTML 转义 */
function escapeHTML(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
