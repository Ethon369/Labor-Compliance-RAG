<!DOCTYPE html>
<html lang="zh-CN" data-theme="cool" data-density="comfortable">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 劳动合规 RAG</title>
<script>
/* 首帧前定主题，避免暗色模式下闪一下白屏 */
(function(){try{var t=localStorage.getItem('lcr_theme');
if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))
document.documentElement.dataset.theme='dark';}catch(e){}})();
</script>
<link rel="stylesheet" href="/tokens.css">
<style>
  body{
    font-family:var(--font-sans); background:var(--paper); color:var(--ink-1);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    font-size:var(--fs-body); line-height:1.7; -webkit-font-smoothing:antialiased; text-wrap:pretty;
    transition:background var(--dur-3) var(--ease-out), color var(--dur-3) var(--ease-out);
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--e3); width:380px; padding:34px 34px 26px;
    transition:background var(--dur-3) var(--ease-out), border-color var(--dur-3) var(--ease-out);
  }
  .logo{
    width:44px;height:44px;border-radius:var(--r-lg);margin:0 auto 16px;
    background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
    box-shadow:var(--e2);
  }
  h1{font-size:var(--fs-h1);font-weight:500;letter-spacing:-.015em;text-align:center;}
  .sub{text-align:center;color:var(--ink-3);font-size:var(--fs-xs);margin:6px 0 22px;}

  .switch{display:flex;background:var(--surface-2);border-radius:var(--r-md);padding:3px;gap:3px;margin-bottom:18px;}
  .switch button{
    flex:1;padding:7px;border-radius:5px;font-size:var(--fs-sm);color:var(--ink-3);
    transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out);
  }
  .switch button.active{background:var(--surface);color:var(--ink-1);box-shadow:var(--e1);}

  input{
    width:100%;border:1px solid var(--line-2);border-radius:var(--r-md);
    padding:11px 14px;font-size:var(--fs-sm);margin-bottom:10px;outline:none;
    background:var(--surface);color:var(--ink-1);
    transition:border-color var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out);
  }
  input::placeholder{color:var(--ink-4);}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);}

  .submit{
    width:100%;background:var(--accent);color:var(--on-accent);border-radius:var(--r-md);
    padding:11px;font-size:var(--fs-sm);font-weight:500;margin-top:4px;
    transition:background var(--dur-1) var(--ease-out);
  }
  .submit:hover{background:var(--accent-hover);}
  .err{color:var(--danger);font-size:var(--fs-xs);min-height:20px;margin-bottom:4px;}
  .ok{color:var(--success);font-size:var(--fs-xs);min-height:20px;margin-bottom:4px;}
  .hint{color:var(--ink-4);font-size:var(--fs-micro);line-height:1.6;margin-top:10px;}
  .back{text-align:center;margin-top:16px;}
  .back a{color:var(--ink-3);font-size:var(--fs-xs);text-decoration:none;transition:color var(--dur-1) var(--ease-out);}
  .back a:hover{color:var(--accent);}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16M12 7v13M8.5 20h7M7 7l-3 6h6zM17 7l-3 6h6z"/>
    </svg>
  </div>
  <h1>劳动合规 RAG</h1>
  <p class="sub">登录后可管理知识库并长期保存会话</p>

  <div class="switch">
    <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
    <button id="tabRegister" onclick="switchTab('register')">注册</button>
    <button id="tabPassword" onclick="switchTab('password')">改密码</button>
  </div>

  <div class="err" id="msg"></div>
  <div class="ok" id="okMsg"></div>

  <input id="fUser" type="text" placeholder="用户名（2-32 位）" autocomplete="username">
  <input id="fPass" type="password" placeholder="密码" autocomplete="current-password">
  <input id="fPass2" type="password" placeholder="确认新密码（改密码时填）" style="display:none">
  <button class="submit" id="submitBtn" onclick="submit()">登录</button>

  <div class="hint" id="modeHint"></div>
  <div class="back"><a href="/">← 返回问答页</a></div>
</div>

<div class="tw" id="tw" data-open="false">
  <button class="tw-fab" id="twFab" aria-label="切换主题">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3a9 9 0 109 9 7 7 0 01-9-9z"/></svg>
  </button>
  <div class="tw-panel">
    <h3>外观</h3>
    <div class="tw-row">
      <label>主题</label>
      <div class="seg" data-key="theme">
        <button data-val="cool" aria-pressed="true">冷白工具</button>
        <button data-val="dark" aria-pressed="false">深墨暗色</button>
      </div>
    </div>
    <p class="tw-note">跟随系统深色偏好，选择会记住。</p>
  </div>
</div>

<script src="/common.js"></script>
<script src="/theme.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let mode = 'login';

function switchTab(m) {
  mode = m;
  $('tabLogin').classList.toggle('active', m === 'login');
  $('tabRegister').classList.toggle('active', m === 'register');
  $('tabPassword').classList.toggle('active', m === 'password');
  $('submitBtn').textContent = m === 'login' ? '登录' : (m === 'register' ? '注册' : '修改密码');
  // 改密码多一个"确认新密码"框；登录/注册隐藏
  $('fPass2').style.display = m === 'password' ? '' : 'none';
  $('fPass').placeholder = m === 'password' ? '旧密码' : '密码';
  $('fPass2').placeholder = m === 'password' ? '新密码（至少 6 位）' : '';
  $('msg').textContent = '';
  $('okMsg').textContent = '';
  $('modeHint').textContent = m === 'password'
    ? '改密码需要先登录（当前浏览器已有登录态即可）。'
    : '';
}

async function submit() {
  const username = $('fUser').value.trim();
  const password = $('fPass').value;
  const password2 = $('fPass2').value;
  $('msg').textContent = ''; $('okMsg').textContent = '';

  if (mode === 'password') {
    if (!getToken()) { $('msg').textContent = '请先登录再修改密码'; return; }
    if (!username || !password || !password2) { $('msg').textContent = '请填写完整'; return; }
    if (password2.length < 6) { $('msg').textContent = '新密码至少 6 位'; return; }
    if (password === password2) { $('msg').textContent = '新密码不能与旧密码相同'; return; }
    try {
      await api('/auth/change-password', {
        method: 'POST',
        json: { old_password: password, new_password: password2 },
        no401: true,                      // 401 在这里给提示，不跳转（自己就是登录页）
      });
      $('okMsg').textContent = '密码已修改，下次登录请使用新密码';
      $('fPass').value = ''; $('fPass2').value = '';
    } catch (e) {
      $('msg').textContent = e.status === 401 ? '登录已过期，请先重新登录' : (e.message || '修改失败');
    }
    return;
  }

  if (!username || !password) { $('msg').textContent = '请填写用户名和密码'; return; }
  if (mode === 'register' && password.length < 4) { $('msg').textContent = '密码至少 4 位'; return; }

  try {
    const data = await api(mode === 'login' ? '/auth/login' : '/auth/register', {
      method: 'POST', json: { username, password }, no401: true,
    });
    saveAuth(data);
    location.href = '/';                      // 登录/注册成功直接回问答页
  } catch (e) {
    $('msg').textContent = e.message || '请求失败';
  }
}

// 从 index 跳来时支持 ?tab=password 直达改密码
const params = new URLSearchParams(location.search);
if (params.get('tab') === 'password') switchTab('password');
</script>
</body>
</html>
