# 生产部署编排 · 劳动与社会保障 RAG 问答平台
#
# 与开发用 docker-compose.yml 的区别：
#   1. postgres 不再映射 5432 到宿主——数据库只在 compose 内网可达，避免被公网扫库
#   2. app 只绑 127.0.0.1:8000，外部流量一律经 nginx，不直接暴露应用端口
#   3. AUTH_SECRET / ADMIN_PASSWORD / POSTGRES_PASSWORD 用 ${VAR:?} 语法：未设置直接启动失败，
#      杜绝"默认值上线"（开发版的 admin/123456 等同裸奔）
#   4. 加内存上限与日志轮转：避免 OOM 拖垮整机、日志撑爆磁盘
#
# 用法：
#   cp .env.production .env && vim .env        # 必须改带【必改】的项
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec app python scripts/ingest_laws.py   # 首次入库
#   curl -I http://localhost/                  # 冒烟

services:
  app:
    build: .
    container_name: labor-app
    # 只绑本机：8000 不进公网，外部一律走 nginx
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://labor:${POSTGRES_PASSWORD}@postgres:5432/labor
      - EMBEDDING_MODE=${EMBEDDING_MODE:-offline}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_BASE_URL=${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      - SILICONFLOW_MODEL=${SILICONFLOW_MODEL:-BAAI/bge-m3}
      - RERANK_MODE=${RERANK_MODE:-offline}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_POOL=${RERANK_POOL:-30}
      - LLM_MODE=${LLM_MODE:-offline}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.0}
      # 下面三项无默认值：没配就拒绝启动（报错信息会提示缺哪个变量）
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET 未设置，请先在 .env 中配置为强随机值}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD 未设置，禁止使用默认口令上线}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1200m

  nginx:
    image: nginx:1.27-alpine
    container_name: labor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m

  postgres:
    image: pgvector/pgvector:pg16
    container_name: labor-pg
    environment:
      POSTGRES_USER: labor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      POSTGRES_DB: labor
    # 生产环境刻意不写 ports：数据库不暴露到公网
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labor -d labor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g

volumes:
  pgdata:
