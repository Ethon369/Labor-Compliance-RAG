# 劳动争议智能合规助手 · Nginx 反代配置
#
# 【核心】/chat 是 SSE（text/event-stream）长连接。Nginx 默认会攒满 buffer 再转发，
# 结果就是"逐字打字机"变成憋半天一次性吐出来。下面 SSE 三件套缺一不可：
#   proxy_buffering off  /  gzip off  /  X-Accel-Buffering: no
#
# 有域名时：把 server_name 的 _ 换成你的域名（如 demo.example.com）

upstream labor_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # 知识库上传单文件限 10MB，这里留些余量
    client_max_body_size 12m;

    # 静态资源：加长缓存头，减轻后端压力
    location ~* \.(js|css|png|svg|ico|woff2?|ttf)$ {
        proxy_pass http://labor_app;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://labor_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 流式三件套 ----
        proxy_buffering off;             # 收到即转发，不攒包
        proxy_cache off;
        gzip off;                        # gzip 会缓冲 SSE
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no; # 显式告知不要缓冲

        # LLM 生成可能持续较久，读超时给足，否则连接会被 nginx 掐断
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
