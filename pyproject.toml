[project]
name = "labor-compliance-rag"
version = "0.1.0"
description = "劳动争议智能合规助手：基于中国劳动法律体系的 RAG 问答系统（个人求职展示项目）"
requires-python = ">=3.11"
dependencies = [
    # 条款级切分入库需要 PG 驱动；psycopg3 为锁定技术栈 PostgreSQL 的配套，见 docs/decisions/02
    "psycopg[binary]>=3.2",
    # V2.4 连接池：替换"每次查询开短连接"，见 docs/decisions/17（唯一获批的性能相关新依赖）
    "psycopg-pool>=3.2",
    # 配置与数据校验：所有 DB 连接串、后续 API key 一律经环境变量 + Pydantic settings 读取
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    # 混合检索的稀疏路（BM25），锁定清单内；其传递依赖 numpy 由 pip 自动带入
    "rank-bm25>=0.2",
    # 阶段 4：LangGraph 流程编排（Agent 编排，锁定清单内）；其基座 langchain-core 为传递依赖
    "langgraph>=1.2",
    # 阶段 6：FastAPI + uvicorn（Web 服务 + SSE 流式接口）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 文件上传（知识库文档）：FastAPI 的 UploadFile 解析必需，官方配套件
    "python-multipart>=0.0.9",
    # V2.3 文档解析：PDF 与 Word 是"知识库上传"绕不开的两种格式，各取一个成熟纯 Python 库
    # （不需要编译依赖；扫描版 PDF 无文字层的问题见 docs/decisions/15 已知取舍）
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

# fetch/解析脚本刻意零第三方依赖（urllib + 标准库正则），理由见 docs/decisions/01

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "db: 需要 labor-pg 真库的集成测试（连不上自动跳过，离线环境不影响全绿）",
]
